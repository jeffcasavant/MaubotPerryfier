[project]
name = "casavant.jeff.perryfier"
version = "1.0.3"
description = "Maubot plugin for adding a brown fedora to existing pictures"
authors = [{ name = "Jeff Casavant", email = "jeff.casavant@gmail.com" }]
license = "MIT"
requires-python = ">=3.12,<4"
dependencies = [
    "maubot (>=0.6.0,<0.7.0)",
    "mautrix (>=0.21.0,<0.22.0)",
    "Pillow (>=13.0.0,<14.0.0)",
    "opencv-python (>=5.0.0,<6.0.0)",
]

[tool.poetry.group.dev.dependencies]
bandit = "^1.9.4"
black = "^26.10.1"
pip-audit = "^2.10.1"
pylint = "^4.1.3"
isort = "^9.0.2"
"ruamel.yaml" = "^0.18.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pylint."MESSAGES_CONTROL"]
disable = [
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "too-few-public-methods",
    "too-many-locals",
    "too-many-statements"
]

[tool.pylint."TYPECHECK"]
# cv2 loads its native module at runtime, where pylint cannot see it
generated-members = ["cv2.*"]

[tool.pylint."FORMAT"]
max-line-length = 120

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.maubot]
maubot = "0.1.0"
modules = ["perryfier"]
main_class = "PerryfierPlugin"
database = false
extra_files = [
  "res/img/perryhat.png",
]
